[build-system]
# Keep build deps installable on Python 3.6 (deployment / mnc_python).
# setuptools>=61 and setuptools_scm>=8 drop 3.6; [project] metadata needs setuptools>=61.
requires = ["setuptools>=45,<60", "wheel", "setuptools_scm[toml]>=6.2,<8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"
